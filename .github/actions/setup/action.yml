name: Setup
description: Install XcodeGen and restore the Swift package cache. The xcode-27 runner image ships one Xcode (D25).
runs:
  using: composite
  steps:
    - name: Install XcodeGen
      shell: bash
      run: brew install xcodegen
    # SwiftPM records absolute paths (e.g. binary artifacts like Sparkle.xcframework), so a cache is only
    # valid at the workspace path it was built in: the key includes it.
    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: build/SourcePackages
        key: spm-${{ runner.os }}-${{ github.workspace }}-${{ hashFiles('project.yml') }}
        restore-keys: spm-${{ runner.os }}-${{ github.workspace }}-
